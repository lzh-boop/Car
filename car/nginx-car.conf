# ================================================
# Nginx 配置 — 车辆管理系统
# 服务器 : 47.103.7.135
# 上传到 : /etc/nginx/conf.d/car.conf
# ================================================

server {
    listen       80;
    server_name  47.103.7.135;

    # 访问日志
    access_log  /var/log/nginx/car_access.log;
    error_log   /var/log/nginx/car_error.log;

    # ── 前端 Vue SPA ──────────────────────────────
    root   /usr/share/nginx/html/car;
    index  index.html;

    # history 路由模式：非文件路径均返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端 REST API 反代 ─────────────────────────
    # 设备上报 /api/location/beidou/device/report 无需 Token，直接转发
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        # 允许所有来源跨域（设备上报无浏览器 CORS 限制，管理端已同源）
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept';
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── WebSocket 反代 ─────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
